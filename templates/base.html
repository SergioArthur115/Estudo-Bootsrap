<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Anime Mania{% endblock %}</title>

    <script>
        (function () {
            const salvo = localStorage.getItem('tema');
            const preferido = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', salvo || preferido);
        })();
    </script>
    

    <!-- Bootstrap 5 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    {% include 'partials/navbar.html' %}

    <main class="container flex-grow-1 py-4">
        {% include 'partials/flash.html' %}
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <!-- Bootstrap 5 (JS, o "bundle" já inclui o Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/forms.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
